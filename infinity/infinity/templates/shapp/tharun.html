<html>
    <head>
        <title>Calculator</title>
    </head>
    <body>
        <h1 align="center">Churn Rate Calculator</h1>
        <h2 align="center">SANJAY R(26009894)</h2>
        <form method="POST">
            {%csrf_token%}
            <label>Initial Customer:</label>
            <input type="text" value="{{i}}" name="Initial_Cust"><br><br>

            <input type="text" value="{{churn}}"><br><br>
        </form>
    </body>
</html>
